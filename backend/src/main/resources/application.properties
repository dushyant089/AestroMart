# Application
spring.application.name=ecommerce

# Logging
logging.level.root=INFO

# ==========================================
# DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eco_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=${PORT:8080}

# ==========================================
# JWT CONFIGURATION
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# BOOTSTRAP ADMIN CONFIGURATION
# ==========================================
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@aestromart.com}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD}
app.bootstrap.admin.first-name=${BOOTSTRAP_ADMIN_FIRST_NAME:System}
app.bootstrap.admin.last-name=${BOOTSTRAP_ADMIN_LAST_NAME:Admin}
app.bootstrap.seed-sample-data=${SEED_SAMPLE_DATA:false}

# ==========================================
# CLOUDINARY CONFIGURATION
# ==========================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:ecommerce/products}

# ==========================================
# RAZORPAY CONFIGURATION
# ==========================================
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# ==========================================
# GMAIL OAUTH CONFIGURATION
# ==========================================
gmail.oauth.credentials-path=${GMAIL_OAUTH_CREDENTIALS_PATH:${user.dir}/gmail-oauth/credentials.json}
gmail.oauth.token-path=${GMAIL_OAUTH_TOKEN_PATH:${user.dir}/gmail-oauth/token.json}
gmail.sender=${GMAIL_SENDER:}









